name: Export to the shelf

# SKB-038 — this public repo is the shelf. The private workbench (peter-tu-zynkr/zynkr-skill-builder)
# builds the public tree in its own export-stage.yml and keeps it as a 3-day artifact, `stage`.
# This job downloads that one file, checks it with tools/publish.mjs (which trusts nothing it did
# not check), mirrors skills/, and posts the signed shelf-v1 body to zynkr.ai on every run.
#
# This repo's run logs are public: no workbench code is checked out here, nothing is uploaded, and
# the publisher names no path until it has proved the stage public.
#
# Scheduled runs stay off until the repository variable SHELF_LIVE is 'true'. The owner's dispatch
# always runs; a run anyone else starts must pass the gate job first (D-145, below). The first
# publish is a dispatch with promote: all. Never add pull_request_target or any
# trigger a fork can reach: the export environment holds WORKBENCH_READ_TOKEN and
# SKILLS_SYNC_HMAC_SECRET. GitHub disables the schedule after 60 days without repository activity:
# `gh workflow enable export.yml -R peter-tu-zynkr/zynkr-ai-skills`, then dispatch once.
# On 2026-10-02 this schedule fired once and then stopped, so a job on the owner's Mac dispatches
# with prune: true (never promote) within 15 minutes of each new green stage, and does nothing
# while SHELF_LIVE is not 'true'. D-145 (ATL-113 D6) moves that job to an hourly cron in zynkr.ai's
# Vercel project, which dispatches with prune alone through a GitHub App of the owner's own; the
# Mac job is switched off once the cron has a green day. If GitHub's schedule recovers, any of
# them together are harmless: one concurrency group, and writes only on change.
#
# ATL-113 Part D — only what Zynkr Atlas lists leaves the team (rulings D-138…D-142). The repository
# variable SHELF_ATLAS chooses:
#   off      the stage is published as above. Set on purpose: unset means enforce since the switch.
#   report   every run asks Atlas, prints what enforce would publish, keep, hold and remove and the
#            parity check of the listings, then publishes as off does. Red if Atlas can't be asked.
#   enforce  a staged folder is published only at the git tree Atlas lists for it; every zynkr.ai
#            row is built from the files the shelf holds; promote is retired. Atlas unreachable, or
#            no usable stage: the run still makes the removals the other side asks for, posts the
#            rows, and is red.
# Atlas is asked with GitHub's OIDC token (audience zynkr-atlas-shelf), so the publish job holds
# id-token: write and no secret: the door at atlas.zynkr.ai checks that GitHub signed it for this
# workflow, on main, in the export environment. Because the job holds that beside contents: write,
# every action is pinned to a commit.
#
# Switched on 2026-10-19 (spec §15.4): report from 18 Oct, enforce at 09:53Z, and DEFAULT_ATLAS_MODE in
# tools/enforce.mjs is 'enforce', so an unset variable enforces and off must be set on purpose (each run
# logs which). The frozen listing text (D-142) is refreshed with `node tools/freeze-text.mjs --shelf .`.
on:
  schedule:
    # Every 15 minutes, off the hour on purpose: GitHub drops scheduled runs under load and names the
    # top of the hour as the worst time. With '*/15' this schedule fired once in its first 7.5 hours
    # (2026-10-02); turning the workflow off and on did not wake it.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      prune:
        description: 'Site rows the shelf no longer holds: report lists them, true removes them'
        type: choice
        options:
          - report
          - 'true'
        default: report
      promote:
        description: 'Publish skills new to the shelf: sheetIds (e.g. 3.24) or slugs, separated by commas, or all. The run summary lists held skills by sheetId. Retired under SHELF_ATLAS=enforce, where Atlas is the only way on.'
        type: string
        default: ''
      allow_shrink:
        description: 'Allow a stage under half of the shelf (and let the site prune past its valve)'
        type: boolean
        default: false
      allow_rewind:
        description: "Allow a stage whose workbench commit does not descend from the last export's"
        type: boolean
        default: false
      seed_fail:
        description: 'Red proof: plant an unlisted file in the stage, so the publisher must refuse'
        type: boolean
        default: false
      seed_atlas:
        description: 'Red proof (SHELF_ATLAS report or enforce): ask Atlas at an address that never resolves, or with the wrong audience'
        type: choice
        options:
          - none
          - unreachable
          - wrong_audience
        default: none

concurrency:
  group: shelf-export
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # D-145: the tick's App holds Actions write, which can dispatch and also re-run any run of the
  # last 30 days at its original inputs and commit. tools/gate.mjs decides, before the export
  # environment, what a run the owner did not start may do: a first, plain dispatch on main (prune
  # alone), and only while SHELF_LIVE is 'true'. The owner's runs and GitHub's schedule pass as before.
  # The gate lives in this file, so it can't stop a dispatch on another ref, which runs that ref's
  # own export.yml. What stops those is the export environment's deployment-branch rule (main
  # only): its secrets never reach a job from any other ref. Keep that rule.
  gate:
    if: github.event_name == 'workflow_dispatch' || vars.SHELF_LIVE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      go: ${{ steps.gate.outputs.go }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: main
          persist-credentials: false

      - name: Who started this run, and with what
        id: gate
        env:
          OWNER: ${{ github.repository_owner }}
          TRIGGERED_BY: ${{ github.triggering_actor }}
          ATTEMPT: ${{ github.run_attempt }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHELF_LIVE: ${{ vars.SHELF_LIVE }}
          PROMOTE: ${{ inputs.promote }}
          ALLOW_SHRINK: ${{ inputs.allow_shrink }}
          ALLOW_REWIND: ${{ inputs.allow_rewind }}
          SEED_FAIL: ${{ inputs.seed_fail }}
          SEED_ATLAS: ${{ inputs.seed_atlas }}
        run: node tools/gate.mjs

  publish:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: export
    permissions:
      # The export commit.
      contents: write
      # GitHub's OIDC token, which Atlas's door checks (ATL-113 Part D). No secret is stored for it.
      id-token: write
      # This run's own start time: the order key of every post to zynkr.ai.
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # main's tip, not github.sha: a run that waited in the concurrency group behind a run
          # that pushed would otherwise mirror onto the older commit, read an older
          # Workbench-Commit, and have its push rejected. Nothing else pushes to main while this
          # run holds the group.
          ref: main
          # The whole history, so the last Workbench-Commit trailer is readable.
          fetch-depth: 0

      # Re-running this job alone reuses the gate job's answer from the first attempt, so the
      # re-run rule is asked again here, before any step that reads a secret (D-145).
      - name: Refuse a re-run the owner did not start
        env:
          OWNER: ${{ github.repository_owner }}
          TRIGGERED_BY: ${{ github.triggering_actor }}
          ATTEMPT: ${{ github.run_attempt }}
        run: node tools/gate.mjs --rerun

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Test the publisher
        run: node --test 'tools/*.test.mjs'

      # Refuses a run that is not on the workbench's main; writes run.json beside stage/ for the
      # publisher, which refuses a stage whose workbench_sha is not that run's commit. A failed
      # download does not stop the job: under SHELF_ATLAS the removals Atlas asks for still go
      # (rule 5). The publisher finds no run.json and says so; with SHELF_ATLAS off it refuses.
      - name: Download the stage
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.WORKBENCH_READ_TOKEN }}
        run: node tools/fetch-stage.mjs --out "$RUNNER_TEMP/in"

      - name: Set the commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Inputs reach the script through env, never ${{ }} inside run:, so a promote string cannot
      # become shell.
      - name: Check, mirror and post
        env:
          WORKBENCH_READ_TOKEN: ${{ secrets.WORKBENCH_READ_TOKEN }}
          SKILLS_SYNC_HMAC_SECRET: ${{ secrets.SKILLS_SYNC_HMAC_SECRET }}
          GITHUB_TOKEN: ${{ github.token }}
          SHELF_ATLAS: ${{ vars.SHELF_ATLAS }}
          EVENT: ${{ github.event_name }}
          PRUNE: ${{ inputs.prune }}
          PROMOTE: ${{ inputs.promote }}
          ALLOW_SHRINK: ${{ inputs.allow_shrink }}
          ALLOW_REWIND: ${{ inputs.allow_rewind }}
          SEED_FAIL: ${{ inputs.seed_fail }}
          SEED_ATLAS: ${{ inputs.seed_atlas }}
        run: |
          args=(--stage "$RUNNER_TEMP/in" --shelf "$GITHUB_WORKSPACE" --event "$EVENT" --run "$RUNNER_TEMP/in/run.json")
          if [ "$EVENT" = "workflow_dispatch" ]; then
            args+=(--prune "$PRUNE")
            if [ -n "$PROMOTE" ]; then args+=(--promote "$PROMOTE"); fi
            if [ "$ALLOW_SHRINK" = "true" ]; then args+=(--allow-shrink); fi
            if [ "$ALLOW_REWIND" = "true" ]; then args+=(--allow-rewind); fi
            if [ "$SEED_FAIL" = "true" ]; then args+=(--seed-fail); fi
            if [ -n "$SEED_ATLAS" ] && [ "$SEED_ATLAS" != "none" ]; then args+=(--seed-atlas "$SEED_ATLAS"); fi
          fi
          node tools/publish.mjs "${args[@]}"
